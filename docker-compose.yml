version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: vyaaparsahayak-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    # command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload # Optional: Enable reload for development

  frontend:
    build:
      context: ./frontend/vyaaparsahayak
    container_name: vyaaparsahayak-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
